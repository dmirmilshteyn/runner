name: Build

on:
  workflow_dispatch:
  push:


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image tag
      id: image_tag
      run: |
        image_tag="ghcr.io/${{ github.repository_owner }}/runner:${{ github.sha }}"
        echo "image_tag=$image_tag" >> "$GITHUB_ENV"
        {
          echo "## Image"
          echo ""
          echo "\`$image_tag\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ env.image_tag }}
        platforms: |
            linux/amd64

    - name: Verify published .NET runtime
      env:
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        image="${image_tag}@${IMAGE_DIGEST}"
        docker pull --platform linux/amd64 "$image"
        docker run --rm --platform linux/amd64 --user root \
          -v "$PWD/scripts:/checks:ro" --entrypoint python3 \
          "$image" /checks/verify-dotnet-runtime.py
        docker run --rm --platform linux/amd64 --entrypoint /home/runner/bin/Runner.Listener \
          "$image" --version
        {
          echo ""
          echo "Verified linux/amd64: \`$image\`; bundled .NET 8.0.33."
        } >> "$GITHUB_STEP_SUMMARY"
